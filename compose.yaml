services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: pharmacy
      POSTGRES_PASSWORD: pharmacy
      POSTGRES_DB: pharmacy
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmacy -d pharmacy"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    build: ./backend
    develop: # Configure development-time file watching.
      watch: # Define which local changes trigger an action.
        - action: rebuild # Rebuild the image and recreate the API container.
          path: ./backend # Watch backend files on your computer.
          ignore: # Exclude generated local files.
            - .venv/ # Ignore the local Python environment.
            - "**/__pycache__/" # Ignore generated Python bytecode.
            - .pytest_cache/ # Ignore pytest's cache.
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://pharmacy:pharmacy@db/pharmacy
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 2s
      timeout: 3s
      retries: 30
  web:
    build:
      context: ./frontend
      target: serve
    develop: # Configure development-time file watching.
      watch: # Define which local changes trigger an action.
        - action: rebuild # Rebuild Angular and recreate the Nginx container.
          path: ./frontend # Watch frontend files on your computer.
          ignore: # Exclude dependencies and generated output.
            - node_modules/ # Dependencies are installed inside the image.
            - dist/ # Ignore compiled frontend output.
            - .angular/ # Ignore Angular's local cache.
            - test-results/ # Ignore browser-test output.
            - playwright-report/ # Ignore generated test reports.
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
  browser-tests:
    profiles: [test]
    build:
      context: ./frontend
      target: test
    environment:
      BASE_URL: http://web
    depends_on:
      web:
        condition: service_started
volumes:
  database:
