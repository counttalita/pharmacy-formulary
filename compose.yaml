services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: pharmacy
      POSTGRES_PASSWORD: pharmacy
      POSTGRES_DB: pharmacy
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmacy -d pharmacy"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://pharmacy:pharmacy@db/pharmacy
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 2s
      timeout: 3s
      retries: 30
  web:
    build:
      context: ./frontend
      target: serve
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
  browser-tests:
    profiles: [test]
    build:
      context: ./frontend
      target: test
    environment:
      BASE_URL: http://web
    depends_on:
      web:
        condition: service_started
volumes:
  database:
